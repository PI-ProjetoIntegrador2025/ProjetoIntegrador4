name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Mantém o  botão de disparo manual ativado com segurança

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true 

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          retention-days: 1 # Limpa o artefato rapidamente para não acumular lixo na memória

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
