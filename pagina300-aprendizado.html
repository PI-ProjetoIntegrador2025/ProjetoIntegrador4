	<!-- Início Aprendizado de Máquina -->
	<div class="main" id="pagina">

		<div class="container"><!-- Início do Container -->

			<div class="row"><!-- Início Entrada Dados -->
				<div class="col">

					<hr />

					<label class="col-sm-9 col-form-label mb-3">
						<h5>Entrada de Dados do Paciente (Atendimento - Recepção -
							Triagem):</h5>
					</label>

					<form action="">
						<div class="row mb-3">

							<div class="col-md-4">
								<div class="card">
									<div class="card-header">
										Município
									</div>
									<div class="card-body">
										<h5 class="card-title">
											<input class="form-control form-control is-valid" type="text" maxlength="3"
												id="diastole" placeholder="ex: São Paulo">
											<div class="valid-feedback small">
												Valor válido
											</div>
										</h5>
									</div>
								</div>
							</div>

							<div class="col-md-2">
								<div class="card">
									<div class="card-header">
										Estado
									</div>
									<div class="card-body">
										<h5 class="card-title">
											<input class="form-control form-control is-valid" type="text" maxlength="2"
												id="diastole" placeholder="ex: SP">
											<div class="valid-feedback small">
												Valor válido
											</div>
										</h5>
									</div>
								</div>
							</div>

							<div class="col-md-2">
								<div class="card">
									<div class="card-header">
										Idade
									</div>
									<div class="card-body">
										<h5 class="card-title">
											<input class="form-control form-control is-valid" type="text" maxlength="2"
												id="diastole" placeholder="ex: 38">
											<div class="valid-feedback small">
												Valor válido
											</div>
										</h5>
									</div>
								</div>
							</div>

						</div>

						<!-- Início botões -->
						<button type="submit" class="btn btn-primary pr-5 pl-5 m-4">Enter</button>
						<!--/ Fim botões -->
					</form>

				</div>
			</div><!-- Fim Entrada Dados -->

			<div class="row"><!-- Início Aprendizado de Máquina Especializada - Hipertensão Arterial -->
				<div class="col">

					<hr />

					<label class="col-sm-9 col-form-label">
						<h5>Modelo de Aprendizado de Máquina Especializada - Hipertensão Arterial:</h5>
					</label>

					<label class="col-sm-9 col-form-label">
						<h6>Desenvolvimento:</h6>
					</label>

					<label class="col-sm-9 col-form-label text-justify">1. Base de dados a nossa disposição:
						“IBGE-PNS-2013”;</label>

					<label class="col-sm-9 col-form-label text-justify">2. Objetivo de especialização: “Score do
						paciente conforme o risco de hipertensão arterial baseada nas diretrizes publicadas em conjunto
						pela Sociedade Brasileira de Cardiologia (SBC), Sociedade Brasileira de Nefrologia (SBN) e
						Sociedade Brasileira de Hipertensão (SBH) (setembro, 2025)”;</label>

					<label class="col-sm-9 col-form-label text-justify">3. Determinação do tipo de Modelo de Aprendizado
						Máquina: Supervisionado, Não-Supervisionado, Aprendizado por Reforço, Semisupervisionado,
						Autosupervisionado, etc;</label>

					<label class="col-sm-9 col-form-label text-justify">3. Determinação do tipo de algoritmo de
						aprendizado: Regressão Linear, Regressão Logística, Árvores de Decisão, etc.</label>

					<label class="col-sm-9 col-form-label">
						<h6>Conceito:</h6>
					</label>

					<label class="col-sm-9 col-form-label text-justify">A aplicação do Modelo de Aprendizado de Máquina
						recebe e utiliza os dados de entrada do paciente para realizar:</label>

					<label class="col-sm-9 col-form-label text-justify">1. Score do paciente: (ex: 8 pts);</label>

					<label class="col-sm-9 col-form-label text-justify">2. Renderizar uma Mensagem: </label>

					<textarea style="height: 115px" class="col-sm-9 text-justify pt-3"
						id="">Exemplo: "O score do paciente, 8 pontos, apresenta risco elevado de pré-hipertensão (valores da PA entre 120 x 80 e 139 x 89 mmHg), ou o risco de uma hipertensão – estágio 1 (valores a partir de 140 x 90 mmHg), por gentileza, consulte as instruções de ações preventivas recomendadas abaixo!”</textarea>

					<label class="col-sm-9 col-form-label text-justify">3. Ações preventivas (recomendações), exemplo:
					</label>

					<label class="col-sm-9 col-form-label text-justify">3.1 Iniciar imediatamente o protocolo MRPA
						(Medição Residencial da Pressão Arterial) para este paciente;</label>

					<label class="col-sm-9 col-form-label text-justify">3.2 Verificar a conveniência de se
						aplicar o protocolo MAPA-24 horas (Monitorização Ambulatorial da Pressão Arterial);</label>

					<label class="col-sm-9 col-form-label text-justify">3.3 Etc.</label>

					<hr />

				</div>
			</div><!-- Fim Aprendizado de Máquina Especializada - Hipertensão Arterial -->
